[project]
name = "sscs-assignment1-sigstore-and-intoto"
version = "0.1.0"
description = "Software Supply Chain Security assignment using Sigstore and in-toto"
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "requests (>=2.34.2,<3.0.0)",
    "cryptography (>=50.0.2,<51.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.17.1,<0.18.0)",
    "mypy (>=2.4.0,<3.0.0)",
    "bandit (>=1.9.4,<2.0.0)",
    "pytest (>=9.1.1,<10.0.0)"
]
